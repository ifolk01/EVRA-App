name: Disparo Semanal do Ranking

on:
  schedule:
    - cron: '0 13 * * 3'
  workflow_dispatch: {}

jobs:
  run-ranking-push:
    runs-on: ubuntu-latest
    steps:
      - name: Fazer Checkout do Código
        uses: actions/checkout@v3
        
      - name: Configurar o Ambiente Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Instalar Dependências
        run: pip install requests ecdsa
          
      - name: Executar o Script de Notificação
        env:
          CLOUDKIT_KEY_ID: ${{ secrets.CLOUDKIT_KEY_ID }}
          CLOUDKIT_PRIVATE_KEY: ${{ secrets.CLOUDKIT_PRIVATE_KEY }}
        run: python scripts/ranking_push.py
